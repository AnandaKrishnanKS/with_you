version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: with_you_postgres
    environment:
      POSTGRES_USER: withyou
      POSTGRES_PASSWORD: withyou_password
      POSTGRES_DB: withyou_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
